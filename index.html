<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/team-maker.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Maker</title>
    <script>
      // 첫 화면이 밝게 떴다가 어두워지는 깜빡임을 막는다. src/lib/theme.ts와 같은 키·규칙을 쓴다.
      (function () {
        var preference = 'system';
        try {
          preference = JSON.parse(localStorage.getItem('theme')) || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
