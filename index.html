<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/team-maker.svg" />
    <!-- viewport-fit=cover: 모바일 하단 고정 바가 홈 표시줄 영역(safe-area)을 알 수 있게 한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="모임·스터디·게임 내전에서 쓰는 팀 나누기. 조건·실력 균형까지 맞춰 랜덤으로 팀을 짜요." />
    <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1a18" media="(prefers-color-scheme: dark)" />
    <title>Team Maker</title>
    <!-- 본문: Pretendard(쓰는 글자 범위만 받는 dynamic subset). 숫자·로고: Bricolage Grotesque. -->
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap"
    />
    <script>
      // 첫 화면이 밝게 떴다가 어두워지는 깜빡임을 막는다. src/lib/theme.ts와 같은 키·규칙을 쓴다.
      (function () {
        var preference = 'system';
        try {
          preference = JSON.parse(localStorage.getItem('theme')) || 'system';
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
